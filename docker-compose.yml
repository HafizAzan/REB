services:
  postgres:
    image: postgres:16-alpine
    container_name: estatex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: estatex
      POSTGRES_PASSWORD: estatex
      POSTGRES_DB: estatex
    ports:
      - "5432:5432"
    volumes:
      - estatex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estatex -d estatex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  estatex_pgdata:
